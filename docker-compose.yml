services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/poe2-analyzer.db
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - poe2_data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      DATABASE_PATH: ":memory:"

  frontend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test

volumes:
  poe2_data:
